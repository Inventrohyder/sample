# Note: Time values are quoted because Dependabot uses YAML 1.1 parsing
# where 09:00 would be treated as a sexagesimal number without quotes
version: 2
updates:
  # ─────────────────────────────
  # 1. npm (main project deps)
  # ─────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00" # yamllint disable-line rule:quoted-strings
      timezone: Africa/Nairobi

    open-pull-requests-limit: 10

    # Allow both security + version updates
    allow:
      - dependency-type: direct
      - dependency-type: indirect

    # ─── Group related updates ───
    groups:
      expo:
        patterns:
          - expo
          - "@expo/*"
          - expo-*
      react-native:
        patterns:
          - react-native
          - "@react-native/*"
          - react-native-*
      react-navigation:
        patterns:
          - "@react-navigation/*"
      eslint:
        patterns:
          - eslint
          - eslint-*
          - "@typescript-eslint/*"
      typescript:
        patterns:
          - typescript
          - "@types/*"
      ui:
        patterns:
          - "@expo/vector-icons"
          - expo-font
          - expo-haptics
          - expo-system-ui
          - expo-symbols
      web:
        patterns:
          - react-dom
          - react-native-web

    # ─── Ignore packages tightly coupled to Expo SDK ───
    ignore:
      # Dependabot shouldn't update these before Expo SDK bump
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

    # ─── Labels and reviewer ───
    labels:
      - dependencies
      - auto-update
    reviewers:
      - inventrohyder

  # ─────────────────────────────
  # 2. GitHub Actions
  # ─────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30" # yamllint disable-line rule:quoted-strings
      timezone: Africa/Nairobi
    labels:
      - ci
      - dependencies
    reviewers:
      - inventrohyder
